name: Build and Attach Module

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach the .bhm to (e.g. v1.8.6)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Resolve tag
        id: resolve-tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.event.release.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Error "No tag provided"
            exit 1
          }
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "Building for tag: $tag"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-tag.outputs.TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore dependencies
        run: dotnet restore src/ItzFeral.TyriasGPS.csproj

      - name: Build Release
        run: dotnet build src/ItzFeral.TyriasGPS.csproj -c Release --no-restore

      - name: Find .bhm artifact
        id: find-bhm
        shell: pwsh
        run: |
          $bhm = Get-ChildItem -Path src/bin/Release/net472 -Filter '*.bhm' | Select-Object -First 1
          if (-not $bhm) {
            Write-Error "No .bhm file found in build output"
            exit 1
          }
          echo "BHM_PATH=$($bhm.FullName)" >> $env:GITHUB_OUTPUT
          echo "BHM_NAME=$($bhm.Name)" >> $env:GITHUB_OUTPUT
          Write-Output "Found: $($bhm.Name) ($($bhm.Length) bytes)"

      - name: Upload .bhm to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.resolve-tag.outputs.TAG }} "${{ steps.find-bhm.outputs.BHM_PATH }}" --clobber
